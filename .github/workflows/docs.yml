# Builds and deploys the clincalc documentation site to GitHub Pages, with the
# browser playground (the engine compiled to WebAssembly behind the desktop
# GUI's frontend) at /try/. The two are independent builds that share one
# Pages deploy and only link to each other.
#
# Method: artifact-based deploy (actions/upload-pages-artifact +
# actions/deploy-pages). The built site is handed straight to GitHub's Pages
# servers as a workflow artifact - there is no `gh-pages` branch, no orphan
# history, nothing in `git log --all` that did not come from a real commit.
#
# Repo prerequisite (one-off): Settings -> Pages -> Source must be set to
# "GitHub Actions". If it is set to "Deploy from a branch", deploy-pages
# fails with "Get Pages site failed". This is set once on the repo and
# persists.
#
# Action SHAs are copied from the sibling repos' docs workflows (the canonical
# living examples) and carry the matching `# vX.Y.Z` comment per house style.

name: docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "examples/**"
      - "mkdocs.yml"
      - "requirements.txt"
      - ".github/workflows/docs.yml"
      # The playground at /try/ is rebuilt whenever the engine, its WebAssembly
      # bindings, or the shared frontend change.
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "clincalc-wasm/**"
      - "gui/**"
      - "!gui/src-tauri/**"
      - "s/web-build"
      - "s/web-wasm"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: zensical-${{ env.cache_id }}
          path: ~/.cache
          restore-keys: |
            zensical-
      - run: pip install -r requirements.txt
      - run: zensical build --clean

      - name: Set up pinned Rust toolchain with the wasm32 target
        shell: bash
        run: |
          rustup toolchain install --no-self-update
          rustup target add wasm32-unknown-unknown
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: clincalc-wasm
      # Must match the exact `wasm-bindgen` pin in clincalc-wasm/Cargo.toml;
      # s/web-wasm fails loudly if they drift.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-bindgen@0.2.130
          fallback: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci
      - name: Build the playground into site/try
        run: s/web-build site/try

      # Drop installer proxies at the site root so users can do
      #   curl -LsSf https://ohtf.github.io/clincalc/install.sh | sh
      # instead of the full GitHub Releases URL. The scripts below simply
      # re-fetch cargo-dist's real installer for the latest release, so they
      # never go stale between docs deploys.
      - name: Add installer proxies
        run: |
          cat > site/install.sh <<'EOF'
          #!/bin/sh
          # clincalc installer proxy - fetches the latest cargo-dist installer.
          # Source: https://github.com/ohtf/clincalc
          set -eu
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/ohtf/clincalc/releases/latest/download/clincalc-installer.sh \
            | sh
          EOF
          chmod +x site/install.sh

          cat > site/install.ps1 <<'EOF'
          # clincalc installer proxy - fetches the latest cargo-dist installer.
          # Source: https://github.com/ohtf/clincalc
          irm https://github.com/ohtf/clincalc/releases/latest/download/clincalc-installer.ps1 | iex
          EOF

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
